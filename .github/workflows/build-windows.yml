name: Build Windows exe

on:
  workflow_dispatch:      # the "Run workflow" button on GitHub
  push:
    tags: ['desktop-v*']  # or push a tag like desktop-v1.0

permissions:
  contents: write         # needed to upload to the "apps" release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Put the upload token inside the exe
        shell: pwsh
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if (-not $env:INGEST_TOKEN) { throw 'Add the GitHub secret INGEST_TOKEN first.' }
          "TOKEN = '$($env:INGEST_TOKEN)'" | Out-File -Encoding ascii hunt_capture/_token.py
      - name: Build
        shell: cmd
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --noconsole --name HuntHQCapture --icon pokeball.ico --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 --hidden-import pystray._win32 --collect-all windows_capture run.py
      - uses: actions/upload-artifact@v4
        with:
          name: HuntHQCapture-windows
          path: desktop/dist/HuntHQCapture.exe
          if-no-files-found: error
      - name: Publish to the apps release
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apps || gh release create apps --title "App downloads" --notes "Latest capture apps."
          gh release upload apps dist/HuntHQCapture.exe --clobber
